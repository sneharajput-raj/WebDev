<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            height: 200px;
            width: 200px;
        }
        .box1{
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1;
        }
        .box2{
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: -1;
        }
        .box3{
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 2;
        }
        /* jiska bhi index no. jada hoga bo upar dikhegii */
    </style>
</head>
<body>
    <div class="box1">
        <img src="../Assets/image.jpg">
    </div>
    <div class="box2">
        <img src="../Assets/boat.jpg">
    </div>
    <div class="box3">
        <img src="../Assets/thar.jpg">
    </div>
</body>
</html>
