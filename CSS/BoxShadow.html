<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            background-color: lightcoral;
            height: 90px;
            width: 130px;
            margin: 30px;
            box-shadow: 0    0      8px   rgb(27, 3, 3);
                    /* top bottom  blur   color*/
        }
        .box2{  /*soft shadow*/
            background-color: rgba(173, 216, 230, 0.819);
            height: 90px;
            width: 130px;
            margin: 30px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.611);
        }
        .box3{     /*inner shadow*/
            background-color: lightslategray;
             height: 120px;
            width: 130px;
            margin: 30px;
            box-shadow: inset 0 4px 6px red;
        }
    </style>
</head>
<body>
    <div class="box1">1</div>
    <div class="box2">2</div>
    <div class="box3">3</div>
</body>
</html>
