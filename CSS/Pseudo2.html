<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            display: none;   /*isse krne se paragraph hide ho jayega*/
        }
        button:hover + p {    /*isse hover krne pr ye paragraph dekhega*/
            display: block;
        }

        img{
            height: 400px; width: 250px;
        }
        img:hover {
            border: 6px solid black;
            border-radius: 10px;
        }

        .btn-grad {background-image: linear-gradient(to right, #16A085 0%, #F4D03F 51%, #16A085 100%);}

.btn-grad {
  margin: 10px;
  padding: 15px 45px;
  text-align: center;
  text-transform: uppercase;
  transition: 0.5s;
  background-size: 200% auto;
  color: white;
  box-shadow: 0 0 20px #eee;
  border-radius: 10px;
  display: block;
  outline: none;
  border: none;
}

.btn-grad:hover {
  background-position: right center;
  color: #fff;
  text-decoration: none;
}
    </style>
</head>
<body>
    <h4>#Button par hover krne se paragraph dikhe</h4>
    <button>Hello</button>
    <p>I am Sneha Rajput!!</p>

    <h3>#readymade button -- gradient button(google search)</h3>
     <button class="btn-grad">rajput</button>

     <img src="../Assets/BMW M5.jpg">

</body>
</html>
