<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        body{
            height: 100vh;
        }
        .header{
            background: lightslategrey;
            /* margin: 5px; */
            display: flex;
            justify-content: space-between;

        }
        .footer{
            background: lightslategray;
            /* margin: 5px; */
            padding: 30px;
        }
        .main{
            height: calc(100vh - 135px);  /*total height(100vh) minus area of header,footer etc..*/
            display: flex;
        }
        .sidebar{
            background-color: lightpink;
            width: 25%;
        }
        .content{
            background-color: lightgreen;
            width: 60%;                       /*total width --> 100%  therefore it is 100% - (25% + 15%)*/
        }
        .ads{
            background-color: lightseagreen;
            width: 15%;
        }
        .left{
            display: flex;
        }
        .right{
            display: flex;
        }
        h3{
            margin: 15px;
            font-family: cursive;
        }
        .item{
            margin: 5px;
            padding: 14px;
            background-color: lightskyblue;
            text-align: center;
        }
        .item:hover{
            background-color: lightpink;
        }
        .box{
            background: darksalmon;
            height: 80px;
            width: 60px;
            margin: 5px;
            padding: 85px;
            border-radius: 7px;
            box-shadow: 4px 3px grey;
        }
        .box:hover{
            background-color: lightgreen;
        }
        .ads{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: x-large;
            padding: 20px;
        }
        .footer{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="left">
            <h3>HTML</h3>
            <h3>CSS</h3>
            <h3>JAVASCRIPT</h3>
            <h3>NODEJS</h3>
            <h3>REACTJS</h3>
        </div>
        <div class="right">
            <h3>HOME</h3>
            <h3>SEARCH</h3>
            <h3>WHISHLIST</h3>
            <h3>MORE</h3>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
           <div class="item">HTML</div>
           <div class="item">CSS</div>
           <div class="item">JS</div>
           <div class="item">JAVA</div>
           <div class="item">PYTHON</div>
           <div class="item">C</div>
           <div class="item">C++</div>
           <div class="item">C#</div>
           <div class="item">RUBY</div>
           <div class="item">MATLAB</div>
           <div class="item">SQL</div>
        </div>
        <div class="content">
            <div style="display: flex;">
                <div class="box">HTML</div>
                <div class="box">CSS</div>
                <div class="box">JS</div>
                <div class="box">REACTJS</div>
                <div class="box">NODEJS</div>
            </div>
            <div style="display: flex;">
                <div class="box">C</div>
                <div class="box">C++</div>
                <div class="box">C#</div>
                <div class="box">PHP</div>
                <div class="box">R</div>
            </div>
            <div style="display: flex;">
                <div class="box">JAVA</div>
                <div class="box">PYTHON</div>
                <div class="box">MATLAB</div>
                <div class="box">PASCAL</div>
                <div class="box">COLAB</div>
            </div>
        </div>
        <div class="ads">EXPLORE MORE <br> LEARN MORE!!</div>
    </div>
    <div class="footer">THANK YOU😊</div>
</body>
</html>
