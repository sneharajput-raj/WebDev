<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p:hover {
            background: lightskyblue;
            font-family: fantasy;

        }
        button{
            background-color: blueviolet;
        }
        button:hover {    /*button:focus  --> bi kr skte isse button pr click krne pr changes honge*/
            background: lightcoral;
        }

        img{
            height: 200px;
        }
        img:hover {
            height: 300px; width: 300px;
            margin: 30px;
        }
    </style>
</head>
<body>
    <h3>HOVER -- means mouse ko content ke upar lane pr css me changes hona</h3>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quas, tempora.</p>
    <button>Register</button>
    <img src="../Assets/bullet.png">
</body>
</html>
