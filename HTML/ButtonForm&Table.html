<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 3px solid rgb(37, 177, 145);
            border-collapse: collapse;
            padding: 5px;
            background-color: rgba(243, 200, 145, 0.766);
        }
    </style>
</head>
<body>
    <h3>Button</h3>
    <button type="submit">Click</button>

    <h3>Form</h3>
    <form>
        <label>Username:</label>
        <input type="text" placeholder="Enter Your Password">
    </form>
    <form>
        <label>Password:</label>
        <input id="Password" type="date">
    </form>

    <h3>List</h3>
    <ol type="I">
        <li>Start</li>
        <li>Work</li>
        <li>Finish</li>
    </ol>

    <ul style="list-style-type: lower-greek;">
        <li>mango</li>
        <li>apple</li>
        <li>kiwi</li>
    </ul>

    <dl>
        <dt>🙆Exercise</dt>
        <dd>-Good for health..!</dd>
        <dt>Calcium</dt>
        <dd>-White food has maximum amount of Calcium.</dd>
    </dl>

    <h3>Table</h3>
    <table>
        <caption>Student Data</caption>
        <tr>
             <th>Name</th>
             <th>Age</th>
             <th>City</th>
        </tr>
        <tr>
            <td>Sanya Rai</td>
            <td>18</td>
            <td>Goa</td>
        </tr>
        <tr>
            <td>Pinku Gupta</td>
            <td>20</td>
            <td>Raipur</td>
        </tr>
        <tr>
            <td>Lucky Rajput</td>
            <td>17</td>
            <td>Udaipur</td>
        </tr>
    </table>
</body>
</html>
