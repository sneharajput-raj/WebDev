<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url(../Assets/boat.jpg);
            background-repeat: no-repeat;
            background-size: cover;
        }
        form {
            padding: 20px;
            box-shadow: 5px 7px 0 rgba(15, 15, 14, 0.645);
            background-color: rgba(172, 146, 146, 0);
            border-style: groove;
            color: rgba(0, 0, 0, 0.982);
            border-radius: 15px;
        }
        label, input{
            padding: 2px;
            margin: 5px;
            border-radius: 4px;
        }
        button{
            display: block;
            margin:  auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Type your Name...">
        <br>
        <label>City:</label>
        <input type="text" placeholder="Type your City...">
        <br>
        <label>Age:</label>
        <input type="range">
        <br>
        <label>DOB:</label>
        <input type="date">
        <br>
        <label>Gender:</label>
        <label>Male</label>
        <input type="radio" name="gender" value="Male">
        <label>Female</label>
        <input type="radio" name="gender" value="Female">
        <label>Others</label>
        <input type="radio" name="gender"  value="Others">
        <br>
        <label>Email:</label>
        <input type="email" placeholder="Enter Your Email...">
        <br>
        <label>Password:</label>
        <input type="password" placeholder="Enter your password...">
        <br>
        <button type="submit" >Register</button>
    </form>
</body>
</html>
